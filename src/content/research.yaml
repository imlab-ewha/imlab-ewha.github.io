- id: fashion-tech
  title: Fashion Tech driven by VLM
  summary: Applying AI to fashion generation, evaluation, and recommendation.
  description: We use vision-language models to generate, evaluate, and iteratively refine fashion images. Our work also explores conversational recommendation, AI sales assistants, and storytelling grounded in fashion product attributes.
  topics:
  - Fashion Image (e.g., GMP) Generation, Evaluation, and Self-Refine
  - AI Sales Assistant (Agent)
  - Fashion Storytelling for Selling
  illustration: /assets/design/research/fashion-tech.webp
  illustration_alt: A dress form, cutting table and digital garment display in a fashion studio
