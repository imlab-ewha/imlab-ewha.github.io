# Research areas, in display order.
# match_pattern: regular expression (case-insensitive) used to link projects and publications to this area.
- id: human-ai
  title: Human Modeling and Human-AI Interactions
  summary: Understanding people and their interactions with AI.
  description: We model people through their behavior, opinions, and feedback to study how humans and AI work together. Our topics include persona-based social simulation, metacognitive Agent-in-the-Loop systems, explainable AI, and user preferences.
  topics:
  - Social Simulation through Synthetic Society
  - Metacognitive AitL with Dynamic Feedback Adaptation
  - Collaborative AI (Transfer Learning and Explainable AI)
  - Deep Learning Based Human Modeling - Rating Prediction
  - Text Analysis - Aspect Based Sentiment Analysis, Opinion Triplet Extraction
  illustration: /assets/design/research/human-ai.webp
  illustration_alt: A model courtyard with pedestrians and paths tracing their movements
