- id: smart-manufacturing
  title: Smart Manufacturing
  summary: Understanding and improving manufacturing through data.
  description: We study causal relationships in manufacturing processes, equipment failure patterns, and combinatorial optimization for quality improvement. Our work draws on manufacturing data and unstructured records to address practical production challenges.
  topics:
  - Causality Analysis
  - Combination Optimization
  - Error Pattern Detection
